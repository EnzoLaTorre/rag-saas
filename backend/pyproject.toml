[project]
name = "rag-saas-backend"
version = "0.1.0"
description = "Backend FastAPI multi-tenant para RAG sobre tus documentos"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008", "UP042"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "integration: requiere Postgres + pgvector (TEST_DATABASE_URL)",
]
