services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://rag:rag@db:5432/rag
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev-secret-cambia-esto-por-uno-largo-de-32-caracteres}
      AI_PROVIDER: ${AI_PROVIDER:-cloud}
      CLOUD_API_KEY: ${CLOUD_API_KEY:-}
      CLOUD_BASE_URL: ${CLOUD_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      CLOUD_CHAT_MODEL: ${CLOUD_CHAT_MODEL:-gemini-2.5-flash}
      CLOUD_EMBED_MODEL: ${CLOUD_EMBED_MODEL:-gemini-embedding-001}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    build: ./backend
    command: ["rq", "worker", "--url", "redis://redis:6379/0", "ingest"]
    environment:
      DATABASE_URL: postgresql+psycopg://rag:rag@db:5432/rag
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev-secret-cambia-esto-por-uno-largo-de-32-caracteres}
      AI_PROVIDER: ${AI_PROVIDER:-cloud}
      CLOUD_API_KEY: ${CLOUD_API_KEY:-}
      CLOUD_BASE_URL: ${CLOUD_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      CLOUD_CHAT_MODEL: ${CLOUD_CHAT_MODEL:-gemini-2.5-flash}
      CLOUD_EMBED_MODEL: ${CLOUD_EMBED_MODEL:-gemini-embedding-001}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

  # Ollama opcional dentro de Compose (GPU/CPU). Descomenta si no usas Ollama en el host.
  # ollama:
  #   image: ollama/ollama:latest
  #   volumes:
  #     - ollama:/root/.ollama
  #   ports:
  #     - "11434:11434"

volumes:
  pgdata:
  # ollama:
